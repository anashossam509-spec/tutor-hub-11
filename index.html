
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Teach Hub | صيانة مؤقتة</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f1a3a;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 20px;
    }
    .container {
      max-width: 450px;
    }
    h1 {
      font-size: 38px;
      color: #FFD700;
    }
    p {
      font-size: 19px;
      line-height: 1.9;
      color: #ddd;
    }
    .logo {
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 1px;
    }
    .status {
      margin-top: 30px;
      padding: 12px;
      border: 1px solid #FFD700;
      border-radius: 10px;
      color: #FFD700;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">TEACH HUB</div>
    <h1>نعود قريباً!</h1>
    <p>
      نعمل حالياً على تطوير وتحسين منصة Teach Hub
      لتقديم تجربة أفضل لكم.
    </p>
    <p>نعتذر عن التوقف المؤقت.</p>
    <div class="status">الموقع تحت الصيانة حالياً</div>
  </div>
</body>
</html>
