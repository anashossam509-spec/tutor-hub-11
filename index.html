<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدرسين أكسلنت - منصة الحجز</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>📚 مدرسين سنتر أكسلنت</h1>
        <p>اختر مدرسك، احجز الآن، وتواصل مباشرة عبر واتساب</p>
    </header>

    <section id="filters">
        <input type="text" id="searchInput" placeholder="🔍 ابحث عن مدرس أو مادة..." onkeyup="filterTeachers()">
        <select id="subjectFilter" onchange="filterTeachers()">
            <option value="all">كل المواد</option>
            <option value="رياضيات">رياضيات</option>
            <option value="عربي">عربي</option>
            <option value="إنجليزي">إنجليزي</option>
            <option value="علوم">علوم</option>
            <option value="فيزياء">فيزياء</option>
            <option value="كيمياء">كيمياء</option>
            <option value="تاريخ">تاريخ</option>
            <option value="جغرافيا">جغرافيا</option>
        </select>
    </section>

    <section id="teachers-container">
        <!-- هيتضاف المدرسين هنا بواسطة JavaScript -->
    </section>

    <footer>
        <p>© 2026 مدرسين أكسلنت - جميع الحقوق محفوظة</p>
    </footer>

    <!-- زر حجوزاتي -->
    <button id="bookings-fab" onclick="showMyBookings()">
        📋 حجوزاتي
        <span class="badge" id="bookings-badge">0</span>
    </button>

    <!-- زر لوحة التحكم (خاص بك) -->
    <button id="admin-fab" onclick="showAdminPanel()">
        📊 لوحة التحكم
    </button>

    <!-- مودال الحجوزات -->
    <div id="bookingsModal" class="modal">
        <div class="modal-content">
            <h2>📋 حجوزاتي</h2>
            <div id="bookings-list"></div>
            <button class="close-btn" onclick="closeModal('bookingsModal')">إغلاق</button>
        </div>
    </div>

    <!-- مودال لوحة التحكم -->
    <div id="adminModal" class="modal">
        <div class="modal-content">
            <h2>📊 إحصاءات المدرسين</h2>
            <div id="admin-list"></div>
            <button class="close-btn" onclick="closeModal('adminModal')">إغلاق</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
