<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مدرسين الشروق - منصة الحجز</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #f0f4f8;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 30px;
            background: linear-gradient(135deg, #1a2a6c, #2d4373);
            color: white;
            border-radius: 20px;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        #filters {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        #searchInput,
        #subjectFilter {
            padding: 12px 20px;
            border: 2px solid #ddd;
            border-radius: 30px;
            font-size: 1rem;
            width: 250px;
            transition: 0.3s;
        }

        #searchInput:focus,
        #subjectFilter:focus {
            outline: none;
            border-color: #1a2a6c;
            box-shadow: 0 0 10px rgba(26, 42, 108, 0.2);
        }

        #teachers-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .teacher-card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            width: 300px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            text-align: center;
            border: 1px solid #e8ecf1;
        }

        .teacher-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
        }

        .teacher-card .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 15px;
            color: white;
            font-size: 2.5rem;
            font-weight: bold;
        }

        .teacher-card h3 {
            font-size: 1.5rem;
            color: #1a2a6c;
            margin-bottom: 8px;
        }

        .teacher-card .subject {
            color: #667eea;
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 10px;
        }

        .teacher-card .detail {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #f0f0f0;
            font-size: 0.95rem;
        }

        .teacher-card .detail:last-of-type {
            border-bottom: none;
        }

        .teacher-card .price {
            color: #2d4373;
            font-weight: bold;
            font-size: 1.2rem;
        }

        .teacher-card .availability {
            color: #27ae60;
            font-weight: bold;
        }

        .teacher-card .availability.full {
            color: #e74c3c;
        }

        .whatsapp-btn {
            display: inline-block;
            background: #25D366;
            color: white;
            padding: 12px 25px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 15px;
            transition: 0.3s;
            width: 100%;
            border: none;
            cursor: pointer;
            font-size: 1rem;
        }

        .whatsapp-btn:hover {
            background: #1da851;
            transform: scale(1.02);
        }

        .whatsapp-btn:disabled {
            background: #95a5a6;
            cursor: not-allowed;
            transform: none;
        }

        footer {
            text-align: center;
            padding: 30px;
            margin-top: 40px;
            color: #7f8c8d;
        }

        .no-results {
            text-align: center;
            font-size: 1.5rem;
            color: #7f8c8d;
            width: 100%;
            padding: 50px 0;
        }

        /* زر حجوزاتي الثابت */
        #bookings-fab {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #1a2a6c;
            color: white;
            padding: 15px 25px;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            z-index: 999;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: 0.3s;
        }

        #bookings-fab:hover {
            transform: scale(1.05);
            background: #2d4373;
        }

        #bookings-fab .badge {
            background: #e74c3c;
            color: white;
            border-radius: 50%;
            padding: 2px 8px;
            font-size: 0.8rem;
        }

        /* المودال */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            padding: 20px;
        }

        .modal-content {
            background: white;
            max-width: 500px;
            margin: 50px auto;
            border-radius: 20px;
            padding: 25px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-content h2 {
            text-align: center;
            color: #1a2a6c;
            margin-bottom: 20px;
        }

        .modal-content .close-btn {
            display: block;
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            cursor: pointer;
        }

        .booking-item {
            border: 1px solid #e8ecf1;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .booking-item .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .booking-item .header strong {
            color: #1a2a6c;
        }

        .booking-item .status {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: white;
        }

        .booking-item .status.pending {
            background: #e74c3c;
        }
        .booking-item .status.confirmed {
            background: #f39c12;
        }
        .booking-item .status.completed {
            background: #27ae60;
        }

        .booking-item .confirm-btn {
            background: #27ae60;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            font-size: 0.95rem;
        }

        .booking-item .confirm-btn:hover {
            background: #219a52;
        }

        .booking-item .success-msg {
            color: #27ae60;
            font-weight: bold;
            margin-top: 10px;
        }

        .booking-item .completed-msg {
            color: #2d4373;
            font-weight: bold;
            margin-top: 10px;
        }

        @media (max-width: 600px) {
            header h1 {
                font-size: 1.8rem;
            }
            #filters {
                flex-direction: column;
                align-items: center;
            }
            #searchInput,
            #subjectFilter {
                width: 90%;
            }
            .teacher-card {
                width: 90%;
            }
            #bookings-fab {
                padding: 12px 18px;
                font-size: 0.9rem;
                bottom: 15px;
                right: 15px;
            }
            .modal-content {
                margin: 20px 10px;
                padding: 15px;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>📚 مدرسين مدينة الشروق</h1>
        <p>اختر مدرسك، احجز الآن، وتواصل مباشرة عبر واتساب</p>
    </header>

    <section id="filters">
        <input type="text" id="searchInput" placeholder="🔍 ابحث عن مدرس أو مادة..." onkeyup="filterTeachers()">
        <select id="subjectFilter" onchange="filterTeachers()">
            <option value="all">كل المواد</option>
            <option value="رياضيات">رياضيات</option>
            <option value="عربي">عربي</option>
            <option value="إنجليزي">إنجليزي</option>
            <option value="علوم">علوم</option>
            <option value="فيزياء">فيزياء</option>
            <option value="كيمياء">كيمياء</option>
            <option value="تاريخ">تاريخ</option>
            <option value="جغرافيا">جغرافيا</option>
        </select>
    </section>

    <section id="teachers-container">
        <!-- هيتضاف المدرسين هنا بواسطة JavaScript -->
    </section>

    <footer>
        <p>© 2026 مدرسين الشروق - جميع الحقوق محفوظة</p>
    </footer>

    <!-- زر حجوزاتي الثابت -->
    <button id="bookings-fab" onclick="showMyBookings()">
        📋 حجوزاتي
        <span class="badge" id="bookings-badge">0</span>
    </button>

    <!-- مودال الحجوزات -->
    <div id="bookingsModal" class="modal">
        <div class="modal-content">
            <h2>📋 حجوزاتي</h2>
            <div id="bookings-list"></div>
            <button class="close-btn" onclick="closeBookings()">إغلاق</button>
        </div>
    </div>

    <script>
        // ===== بيانات المدرسين (١٠ مدرسين من مدينة الشروق) =====
        const teachers = [{
            id: 1,
            name: "أحمد محمد",
            subject: "رياضيات",
            price: 200,
            location: "السنتر - المجموعة ١",
            available: 3,
            phone: "201012345678",
            rating: 4.8
        }, {
            id: 2,
            name: "سارة علي",
            subject: "عربي",
            price: 150,
            location: "السنتر - المجموعة ٣",
            available: 2,
            phone: "201098765432",
            rating: 4.9
        }, {
            id: 3,
            name: "محمد خالد",
            subject: "إنجليزي",
            price: 180,
            location: "السنتر - المجموعة ٢",
            available: 4,
            phone: "2010555666777",
            rating: 4.7
        }, {
            id: 4,
            name: "نورا أحمد",
            subject: "علوم",
            price: 170,
            location: "السنتر - المجموعة ٤",
            available: 1,
            phone: "2010111222333",
            rating: 4.6
        }, {
            id: 5,
            name: "كريم يوسف",
            subject: "فيزياء",
            price: 220,
            location: "السنتر - المجموعة ١",
            available: 2,
            phone: "2010222333444",
            rating: 4.9
        }, {
            id: 6,
            name: "منى إبراهيم",
            subject: "كيمياء",
            price: 210,
            location: "السنتر - المجموعة ٣",
            available: 3,
            phone: "2010333444555",
            rating: 4.7
        }, {
            id: 7,
            name: "عمر حسن",
            subject: "تاريخ",
            price: 160,
            location: "السنتر - المجموعة ٢",
            available: 0,
            phone: "2010444555666",
            rating: 4.5
        }, {
            id: 8,
            name: "ليلى عبدالله",
            subject: "جغرافيا",
            price: 160,
            location: "السنتر - المجموعة ٤",
            available: 2,
            phone: "2010555666777",
            rating: 4.8
        }, {
            id: 9,
            name: "مصطفى رجب",
            subject: "رياضيات",
            price: 190,
            location: "السنتر - المجموعة ١",
            available: 1,
            phone: "2010666777888",
            rating: 4.4
        }, {
            id: 10,
            name: "هدى سمير",
            subject: "إنجليزي",
            price: 200,
            location: "السنتر - المجموعة ٣",
            available: 3,
            phone: "2010777888999",
            rating: 4.9
        }];

        // ===== عرض المدرسين =====
        function displayTeachers(teachersList) {
            const container = document.getElementById('teachers-container');
            container.innerHTML = '';

            if (teachersList.length === 0) {
                container.innerHTML = '<div class="no-results">😕 لا يوجد مدرسين مطابقين للبحث</div>';
                return;
            }

            teachersList.forEach(teacher => {
                const availabilityClass = teacher.available > 0 ? 'availability' : 'availability full';
                const availabilityText = teacher.available > 0 ? `🟢 ${teacher.available} أماكن فاضية` : '🔴 مكتمل';
                const isDisabled = teacher.available <= 0 ? 'disabled' : '';

                const card = `
                        <div class="teacher-card">
                            <div class="avatar">${teacher.name.charAt(0)}</div>
                            <h3>${teacher.name}</h3>
                            <div class="subject">📚 ${teacher.subject}</div>
                            <div class="detail">
                                <span>💰 السعر</span>
                                <span class="price">${teacher.price} ج / ساعة</span>
                            </div>
                            <div class="detail">
                                <span>📍 المكان</span>
                                <span>${teacher.location}</span>
                            </div>
                            <div class="detail">
                                <span>📊 التوفر</span>
                                <span class="${availabilityClass}">${availabilityText}</span>
                            </div>
                            <div class="detail">
                                <span>⭐ التقييم</span>
                                <span>${teacher.rating} / 5</span>
                            </div>
                            <button class="whatsapp-btn" onclick="bookLesson(${teacher.id})" ${isDisabled}>
                                ${teacher.available > 0 ? '📱 احجز الآن' : '🔴 غير متاح'}
                            </button>
                        </div>
                    `;
                container.innerHTML += card;
            });
        }

        // ===== فلتر البحث =====
        function filterTeachers() {
            const searchText = document.getElementById('searchInput').value.toLowerCase();
            const subjectFilter = document.getElementById('subjectFilter').value;

            const filtered = teachers.filter(teacher => {
                const matchName = teacher.name.includes(searchText);
                const matchSubject = teacher.subject.includes(searchText);
                const matchFilter = subjectFilter === 'all' || teacher.subject === subjectFilter;

                return (matchName || matchSubject) && matchFilter;
            });

            displayTeachers(filtered);
        }

        // ===== تحديث العدد في شارة الحجوزات =====
        function updateBookingBadge() {
            const bookings = JSON.parse(localStorage.getItem('bookings') || '[]');
            const pending = bookings.filter(b => b.status === 'pending').length;
            const badge = document.getElementById('bookings-badge');
            if (pending > 0) {
                badge.textContent = pending;
                badge.style.display = 'inline';
            } else {
                badge.style.display = 'none';
            }
        }

        // ===== نظام الحجز =====
        function bookLesson(teacherId) {
            const teacher = teachers.find(t => t.id === teacherId);
            if (!teacher) return;

            if (teacher.available <= 0) {
                alert("❌ عذرًا، هذا المدرس ليس لديه أماكن فاضية حاليًا.");
                return;
            }

            const commission = Math.round(teacher.price * 0.1);

            const confirmBooking = confirm(
                `📚 تأكيد حجز درس\n\n` +
                `المدرس: ${teacher.name}\n` +
                `المادة: ${teacher.subject}\n` +
                `السعر: ${teacher.price} ج\n` +
                `العمولة (١٠٪): ${commission} ج (يدفعها المدرس بعد الدرس)\n\n` +
                `❗ ملاحظة: بعد الدرس، ارجع إلى المنصة وأكد استلام الدرس.\n` +
                `سيتم إرسال رقم واتساب المدرس بعد التأكيد.`
            );

            if (confirmBooking) {
                const studentPhone = prompt("📱 أدخل رقم واتسابك (مثال: 201012345678) للتواصل مع المدرس:");
                if (!studentPhone) {
                    alert("❌ رقم واتساب مطلوب لإتمام الحجز.");
                    return;
                }

                const booking = {
                    id: Date.now(),
                    teacherId: teacher.id,
                    teacherName: teacher.name,
                    subject: teacher.subject,
                    price: teacher.price,
                    commission: commission,
                    studentPhone: studentPhone,
                    date: new Date().toISOString(),
                    status: "pending"
                };

                let bookings = JSON.parse(localStorage.getItem('bookings') || '[]');
                bookings.push(booking);
                localStorage.setItem('bookings', JSON.stringify(bookings));

                teacher.available -= 1;

                alert(
                    `✅ تم حجز درس مع الأستاذ ${teacher.name}!\n\n` +
                    `📱 رقم واتساب المدرس: ${teacher.phone}\n` +
                    `تواصل معه الآن وأخبره أنك جئت من منصة مدرسين الشروق.\n\n` +
                    `📌 بعد الدرس، ارجع إلى المنصة واضغط "حجوزاتي" ثم "أكدت استلام الدرس".`
                );

                window.open(`https://wa.me/${teacher.phone}?text=أريد%20حجز%20درس`, '_blank');

                displayTeachers(teachers);
                updateBookingBadge();
            }
        }

        // ===== عرض حجوزات الطالب =====
        function showMyBookings() {
            const bookings = JSON.parse(localStorage.getItem('bookings') || '[]');
            const list = document.getElementById('bookings-list');
            const modal = document.getElementById('bookingsModal');

            if (bookings.length === 0) {
                list.innerHTML = '<p style="text-align:center;color:#7f8c8d;">📭 ليس لديك حجوزات حالياً</p>';
            } else {
                list.innerHTML = bookings.map((b, index) => {
                    const statusClass = b.status === 'pending' ? 'pending' : b.status === 'confirmed' ? 'confirmed' :
                        'completed';
                    const statusText = b.status === 'pending' ? '⏳ قيد الانتظار' : b.status === 'confirmed' ?
                        '📌 تم التأكيد' : '✅ تم الإنجاز';

                    let actionButton = '';
                    if (b.status === 'pending') {
                        actionButton = `
                                <button class="confirm-btn" onclick="confirmLesson(${index})">
                                    ✅ أكدت استلام الدرس
                                </button>
                            `;
                    } else if (b.status === 'confirmed') {
                        actionButton = `<p class="success-msg">✅ تم تأكيد الدرس، شكراً لك!</p>`;
                                        } else if (b.status === 'completed') {
                        actionButton = `<p class="completed-msg">🎉 تم إتمام الدرس، نتمنى لك التوفيق!</p>`;
                    }

                    return `
                            <div class="booking-item">
                                <div class="header">
                                    <strong>${b.teacherName}</strong>
                                    <span class="status ${statusClass}">${statusText}</span>
                                </div>
                                <p style="margin:5px 0;">📚 ${b.subject} | 💰 ${b.price} ج</p>
                                <p style="font-size:0.85rem;color:#7f8c8d;">📅 ${new Date(b.date).toLocaleString()}</p>
                                ${actionButton}
                            </div>
                        `;
                }).join('');
            }

            modal.style.display = 'block';
            updateBookingBadge();
        }

        // ===== تأكيد استلام الدرس =====
        function confirmLesson(index) {
            const bookings = JSON.parse(localStorage.getItem('bookings') || '[]');
            if (index >= bookings.length) return;

            const booking = bookings[index];

            const sure = confirm(
                `✅ هل أنت متأكد أنك استلمت الدرس مع الأستاذ ${booking.teacherName}؟\n\n` +
                `❗ هذا التأكيد يعني أن المدرس سيتم إخطاره بدفع العمولة (${booking.commission} ج).`
            );

            if (sure) {
                bookings[index].status = 'confirmed';
                localStorage.setItem('bookings', JSON.stringify(bookings));

                const teacher = teachers.find(t => t.id === booking.teacherId);
                if (teacher) {
                    const message =
                        `مرحباً أستاذ ${teacher.name}،\n` +
                        `قام الطالب بتأكيد استلام الدرس.\n` +
                        `المادة: ${booking.subject}\n` +
                        `السعر: ${booking.price} ج\n` +
                        `العمولة المستحقة (١٠٪): ${booking.commission} ج\n` +
                        `يرجى تحويل العمولة على رقم فودافون كاش: ٠١٢٣٤٥٦٧٨٩\n` +
                        `شكراً لاستخدامك منصة مدرسين الشروق.`;

                    window.open(`https://wa.me/${teacher.phone}?text=${encodeURIComponent(message)}`, '_blank');
                }

                alert('✅ تم تأكيد استلام الدرس!\nسيتم إخطار المدرس ليدفع العمولة.');
                showMyBookings();
                updateBookingBadge();
            }
        }

        // ===== إغلاق المودال =====
        function closeBookings() {
            document.getElementById('bookingsModal').style.display = 'none';
        }

        // ===== إغلاق المودال بالضغط خارجها =====
        window.onclick = function(event) {
            const modal = document.getElementById('bookingsModal');
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        }

        // ===== تحميل الصفحة =====
        document.addEventListener('DOMContentLoaded', () => {
            displayTeachers(teachers);
            updateBookingBadge();
        });
    </script>

</body>
</html>
